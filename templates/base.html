<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Vitesse Control Center{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- VCC stylesheet -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="app">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="logo">

                <i class="bi bi-controller"></i>

            </div>

            <div>

                <div class="logo-title">
                    VCC
                </div>

                <div class="logo-subtitle">
                    Vitesse Control Center
                </div>

            </div>

        </div>

        <nav class="menu">

            <a href="/" class="menu-item">

                <i class="bi bi-speedometer2"></i>

                Dashboard

            </a>

            <a href="/games" class="menu-item">

                <i class="bi bi-controller"></i>

                Games

            </a>

            <a href="/git" class="menu-item">
                
				<i class="bi bi-git"></i>
                
				Git
            </a>
			
            <a href="/missing-updates" class="menu-item">

                <i class="bi bi-arrow-up-circle"></i>

                Missing Updates

            </a>

            <a href="/orphans" class="menu-item">

                <i class="bi bi-box-seam"></i>

                Orphan Updates

            </a>

            <a href="/duplicates" class="menu-item">

                <i class="bi bi-files"></i>

                Duplicate Updates

            </a>

            <hr>

            <a href="/reports" class="menu-item">

                <i class="bi bi-file-earmark-text"></i>

                Reports

            </a>

            <a href="/settings" class="menu-item">

                <i class="bi bi-gear"></i>

                Settings

            </a>

        </nav>

    </aside>

    <!-- Main -->

    <main class="main">

        <!-- Top bar -->

        <header class="topbar">

            <div>

                <h1 class="page-title">

                    {% block page_title %}
                    Dashboard
                    {% endblock %}

                </h1>

            </div>

            <div class="status">

                <span class="status-dot"></span>

                DS220 Online

            </div>

        </header>

        <!-- Page -->

        <section class="content">

            {% block content %}
            {% endblock %}

        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
