{% extends "base.html" %}

{% block title %}Orphan Updates{% endblock %}

{% block content %}

<h1>Orphan Updates</h1>

<div id="empty-state" class="alert alert-success d-none">
    ✔ No orphan updates found.
</div>

<div style="margin-bottom:15px;">
    <input
        id="quickFilter"
        type="text"
        placeholder="Search..."
        style="
            width:350px;
            padding:10px;
            border-radius:6px;
            border:1px solid #444;
            background:#1b1f27;
            color:white;
        ">
</div>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.2/styles/ag-grid.css">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.2/styles/ag-theme-quartz.css">

<div
    id="games-grid"
    class="ag-theme-quartz-dark"
    style="height:700px;width:100%;">
</div>

{% endblock %}

{% block scripts %}

<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.2/dist/ag-grid-community.min.js"></script>

<script src="{{ url_for('static', filename='js/pages/orphan_updates.js') }}"></script>

{{ super() }}

{% endblock %}
